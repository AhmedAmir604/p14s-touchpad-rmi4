PACKAGE_NAME="p14s-touchpad"
PACKAGE_VERSION="0.1"

# Layout and mechanism follow orospakr/thinkpad-t14-amd-touchpad: pristine
# kernel files in drivers/ (here from Ubuntu's linux-source package, see
# KERNEL_SOURCE) with the patches applied at build time.  A patch that does
# not apply or a build that fails is the loud signal; the stock modules then
# load and the pad silently returns to PS/2 -- tools/touchpad-check shows it.
PRE_BUILD="tools/pre-build.sh ${kernelver}"
PATCH[0]="0001-i2c-piix4-add-SMBus-Host-Notify-through-the-ASF-target-block-on-SMB0001-platforms.patch"
PATCH[1]="0002-Input-synaptics-rmi4-let-the-device-settle-after-the-PS2-reset-on-SMBus-resume.patch"
PATCH[2]="0003-Input-synaptics-set-the-RMI4-doze-interval-Windows-uses-on-affected-ThinkPads.patch"
# Local: psmouse parameters synaptics_rmi_nosleep / synaptics_rmi_doze_interval
# (inert unless set in modprobe.d) and a log line with the values passed.
PATCH[3]="0006-local-psmouse-rmi-power-management-knobs.diff"

MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# Installed to /updates so depmod prefers them over the in-tree modules;
# DKMS keeps the originals and restores them on remove.
BUILT_MODULE_NAME[0]="i2c-piix4"
BUILT_MODULE_LOCATION[0]="drivers/i2c/busses/"
DEST_MODULE_LOCATION[0]="/updates"

BUILT_MODULE_NAME[1]="rmi_smbus"
BUILT_MODULE_LOCATION[1]="drivers/input/rmi4/"
DEST_MODULE_LOCATION[1]="/updates"

BUILT_MODULE_NAME[2]="psmouse"
BUILT_MODULE_LOCATION[2]="drivers/input/mouse/"
DEST_MODULE_LOCATION[2]="/updates"

AUTOINSTALL="yes"
